<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Smart Parking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- แก้ไฟล์ CSS/JS เมื่อไร ให้เพิ่มเลข ?v= เพื่อให้มือถือโหลดไฟล์ใหม่ -->
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/dashboard.css?v=1">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">P</div>
      <div><h1>Smart Parking</h1><small>ช่องจอดว่างแบบเรียลไทม์</small></div>
    </div>
    <div class="live" id="live"><i></i><span id="liveText">กำลังเชื่อมต่อ</span></div>
  </header>

  <section class="summary">
    <div class="label">ช่องจอดว่างทั้งหมด</div>
    <div class="big"><b id="totalFree">–</b><span id="totalOf">/ – ช่อง</span></div>
    <div class="bar"><div id="totalBar" style="width:0"></div></div>
  </section>

  <div class="hint">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    กรุณาเลือกชั้นจอดเพื่อใช้ระบบนำทาง
  </div>

  <div class="floors" id="floors"></div>

  <div class="legend">
    <span><i class="l-free"></i>ว่าง</span>
    <span><i class="l-taken"></i>มีรถ</span>
    <span><i class="l-unknown"></i>ไม่มีข้อมูล</span>
  </div>
  <div class="updated" id="updated"></div>
</div>

<div class="cta"><button id="go" disabled>เลือกชั้นที่ต้องการจอด</button></div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=1"></script>
<script src="js/parking.js?v=1"></script>
<script src="js/dashboard.js?v=1"></script>
</body>
</html>
